services:
  mongodb:
    image: mongo:7.0
    container_name: household-tracker-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - household_tracker_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  household_tracker_mongo_data: